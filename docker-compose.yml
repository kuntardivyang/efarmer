version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: efarmer-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=efarmer
    networks:
      - efarmer-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: efarmer-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=farmer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - efarmer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend
  express:
    build:
      context: ./efarmer
      dockerfile: Dockerfile.backend
    container_name: efarmer-express
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./efarmer/Backend/uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/efarmer
      - JWT_SECRET=${JWT_SECRET:-your-production-jwt-secret}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - efarmer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Backend
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: efarmer-django
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
      - ./backend/plant_disease_model.h5:/app/plant_disease_model.h5:ro
      - ./backend/knn_crop_recommendation_model.pkl:/app/knn_crop_recommendation_model.pkl:ro
      - ./backend/label_encoder.pkl:/app/label_encoder.pkl:ro
      - ./backend/scaler.pkl:/app/scaler.pkl:ro
    environment:
      - DEBUG=False
      - SECRET_KEY=${DJANGO_SECRET_KEY:-your-production-django-secret}
      - ALLOWED_HOSTS=localhost,127.0.0.1,django
      - DB_NAME=farmer
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - efarmer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./efarmer
      dockerfile: Dockerfile.frontend
    container_name: efarmer-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_EXPRESS_API_URL=http://localhost:5000
      - REACT_APP_DJANGO_API_URL=http://localhost:8000
    depends_on:
      - express
      - django
    networks:
      - efarmer-network

volumes:
  mongodb_data:
  postgres_data:

networks:
  efarmer-network:
    driver: bridge
